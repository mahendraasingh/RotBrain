<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RotBrain — Boutique Screen-Time & Reels Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        height: 100%;
        width: 100%;
        background-color: #050608;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      /* Two26 Studio Ambient Grain & Studio Lighting */
      .app-shell {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background: 
          radial-gradient(circle at 85% 15%, rgba(255, 84, 0, 0.12) 0%, transparent 45%),
          radial-gradient(circle at 15% 85%, rgba(139, 92, 246, 0.10) 0%, transparent 45%),
          #06070A;
        position: relative;
      }
      .app-shell::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.035'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 1;
      }
      .mobile-frame {
        width: 100%;
        max-width: 440px;
        height: 100%;
        max-height: 920px;
        background-color: #090A0F;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(255, 255, 255, 0.09);
        z-index: 2;
        perspective: 1200px;
      }
      @media (min-width: 480px) {
        .mobile-frame {
          border-radius: 42px;
          box-shadow: 
            0 30px 80px -20px rgba(0, 0, 0, 0.9),
            0 0 0 1px rgba(255, 255, 255, 0.08),
            0 0 60px rgba(255, 84, 0, 0.08);
          height: calc(100% - 44px);
        }
      }
      /* Custom smooth boutique scrollbar */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #FF5400;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div id="root" class="mobile-frame"></div>
    </div>
    <script type="module" src="/src/webEntry.tsx"></script>
  </body>
</html>
