<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RotBrain — Reels & Shorts Tracker with 3D Brain Animations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      html, body, #root {
        height: 100%;
        width: 100%;
        background-color: #07080B;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      /* Center mobile device simulation container on large desktop screens */
      .app-shell {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 50% 20%, #151828 0%, #07080B 70%);
      }
      .mobile-frame {
        width: 100%;
        max-width: 440px;
        height: 100%;
        max-height: 920px;
        background-color: #0B0C10;
        overflow: hidden;
        position: relative;
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      @media (min-width: 480px) {
        .mobile-frame {
          border-radius: 40px;
          box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px rgba(139, 92, 246, 0.15);
          height: calc(100% - 40px);
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div id="root" class="mobile-frame"></div>
    </div>
    <script type="module" src="/src/webEntry.tsx"></script>
  </body>
</html>
